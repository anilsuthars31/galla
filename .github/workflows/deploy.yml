# Publishes the web app to GitHub Pages (https://<user>.github.io/<repo>/) when main changes.
# The statement is still read in the browser; accounts and business profiles go to the API on Render
# (server/, deployed by Render itself on the same push).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Pages serves the site from /<repo>/, so assets and model.json need that base path.
      - run: npx tsc -b && npx vite build --base="/${{ github.event.repository.name }}/"
        env:
          # Public address of the API (not a secret). Change it here if the Render service is renamed.
          VITE_API_URL: https://galla-api-gvzg.onrender.com
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
