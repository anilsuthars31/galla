# Runs on every push and pull request: app tests, type-check + build, API tests, and the Python feature tests.
name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: App tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fails if the schema changed but no migration was generated for it.
      - run: npx drizzle-kit generate --name ci-check && git diff --exit-code --stat -- drizzle && test -z "$(git status --porcelain -- drizzle)"

  ml:
    name: ML feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      # Only what the tests need (requirements.txt also pulls in Jupyter for the notebooks).
      - run: pip install scikit-learn pandas numpy
      - run: python -m unittest -v test_features
        working-directory: ml
